<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>FMS Overlay</title>
    <!-- RvB typeface; without internet it falls back to Bahnschrift, which ships with Windows -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: transparent;
        font-family: "Arial Black", "Impact", sans-serif;
        overflow: hidden;
      }

      .hidden { display: none !important; }

      .match-badge {
        position: fixed;
        top: 30px;
        right: 30px;
        background: rgba(0, 0, 0, 0.75);
        border: 2px solid #f39c12;
        border-radius: 8px;
        padding: 6px 22px;
        color: #f39c12;
        font-size: 24px;
        letter-spacing: 3px;
        text-transform: uppercase;
        white-space: nowrap;
        text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      }

      .match-badge span {
        color: #fff;
        font-size: 28px;
        margin-left: 8px;
      }

      .timer {
        position: fixed;
        top: 100px;
        right: 30px;
        background: rgba(0, 0, 0, 0.75);
        border: 2px solid #fff;
        border-radius: 8px;
        padding: 8px 30px;
        font-size: 64px;
        color: #fff;
        letter-spacing: 4px;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      }

      .timer.urgent { border-color: #e74c3c; color: #e74c3c; }
      .timer.hidden { display: none; }

      .team-wrapper {
        position: fixed;
        bottom: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .team1-wrapper { left: 40px; }
      .team2-wrapper { right: 40px; }

      .ondeck-label {
        display: none;
        background: rgba(0, 0, 0, 0.65);
        border-radius: 8px;
        padding: 8px 20px;
        font-size: 18px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #aaa;
        white-space: nowrap;
      }

      .ondeck-label.visible { display: block; }
      .ondeck-label strong { color: #fff; font-size: 22px; }

      .team1-wrapper .ondeck-label strong { color: #5dade2; }
      .team2-wrapper .ondeck-label strong { color: #ec7063; }

      .team-box {
        background: rgba(0, 0, 0, 0.75);
        border: 3px solid #fff;
        border-radius: 12px;
        padding: 18px 40px;
        text-align: center;
        min-width: 150px;
      }

      .team-label {
        font-size: 16px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 6px;
      }

      .team-number {
        font-size: 72px;
        color: #fff;
        line-height: 1;
        text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      }

      .team1-wrapper .team-box { border-color: #3498db; }
      .team1-wrapper .team-number { color: #3498db; }
      .team2-wrapper .team-box { border-color: #e74c3c; }
      .team2-wrapper .team-number { color: #e74c3c; }

      .team-name {
        font-size: 16px;
        color: #ccc;
        letter-spacing: 1px;
        margin-top: 6px;
        text-transform: uppercase;
      }

      .arrows {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        gap: 8px;
        align-items: center;
      }

      .arrows.visible { display: flex; }
      .arrow { font-size: 64px; line-height: 1; }
      .arrow:first-child { color: #3498db; }
      .arrow:last-child { color: #e74c3c; }

      .winner-banner {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        background: rgba(0, 0, 0, 0.85);
        border: 3px solid #fff;
        border-radius: 12px;
        padding: 16px 40px;
        text-align: center;
      }

      .winner-banner.visible { display: block; }
      .winner-label {
        font-size: 20px;
        color: #fff;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .winner-name {
        font-size: 52px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 3px;
      }
      .winner-banner.team1 { border-color: #3498db; }
      .winner-banner.team1 .winner-name { color: #3498db; }
      .winner-banner.team2 { border-color: #e74c3c; }
      .winner-banner.team2 .winner-name { color: #e74c3c; }

      /* ---------- RvB: score bar at the bottom, clock in the upper left ---------- */
      #rvb-root {
        --plate: rgba(15, 15, 16, 0.9);
        --hairline: rgba(237, 237, 237, 0.08);
        --text: #ededed;
        --text-2: #a1a1a6;
        --text-3: #85858b;
        --blue: #3498db;
        --red: #e74c3c;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);

        position: fixed;
        inset: 0;
        display: none;
        font-family: "Barlow Condensed", "Bahnschrift", "Arial Narrow", sans-serif;
        font-weight: 500;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      #rvb-root.visible { display: block; }

      .rvb-bar {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        display: flex;
        background: var(--plate);
        border: 1px solid var(--hairline);
        border-radius: 12px;
        overflow: hidden;
      }

      .rvb-alliance {
        position: relative;
        display: flex;
        align-items: center;
        gap: 24px;
        height: 120px;
        padding: 0 28px;
      }
      .rvb-alliance.blue { --c: var(--blue); padding-left: 40px; border-right: 1px solid var(--hairline); }
      .rvb-alliance.red { --c: var(--red); padding-right: 40px; flex-direction: row-reverse; }

      /* bumper stripe: the alliance color lives here and nowhere else */
      .rvb-alliance::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 12px;
        background: var(--c);
      }
      .rvb-alliance.blue::before { left: 0; }
      .rvb-alliance.red::before { right: 0; }

      /* a goal washes the plate in its alliance color for a moment */
      .rvb-alliance::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--c);
        opacity: 0;
        pointer-events: none;
      }
      .rvb-alliance.scored::after { animation: rvb-flash 700ms var(--ease); }
      @keyframes rvb-flash { from { opacity: 0.28; } to { opacity: 0; } }

      .rvb-meta { display: flex; flex-direction: column; gap: 4px; min-width: 200px; }
      .rvb-alliance.red .rvb-meta { align-items: flex-end; }

      .rvb-team { display: flex; align-items: baseline; gap: 8px; font-size: 28px; line-height: 1; white-space: nowrap; }
      .rvb-alliance.red .rvb-team { flex-direction: row-reverse; }
      .rvb-team .num { color: var(--text-2); font-weight: 400; }
      .rvb-team .name:empty { display: none; }

      .rvb-detail { margin-top: 4px; font-size: 20px; line-height: 1; color: var(--text-3); font-weight: 400; }

      .rvb-score {
        width: 2ch;
        text-align: center;
        font-size: 88px;
        line-height: 1;
        font-weight: 600;
      }
      .rvb-score.bump { animation: rvb-rise 300ms var(--ease); }
      @keyframes rvb-rise { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }

      .rvb-clock {
        position: fixed;
        top: 40px;
        left: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        height: 120px;
        min-width: 200px;
        padding: 0 28px;
        background: var(--plate);
        border: 1px solid var(--hairline);
        border-radius: 12px;
      }
      .rvb-clock .context { font-size: 20px; line-height: 1; color: var(--text-2); font-weight: 400; white-space: nowrap; }
      .rvb-clock .time { font-size: 52px; line-height: 1; font-weight: 600; }
      /* last 10 seconds: invert instead of going red, which would read as the red alliance */
      .rvb-clock.urgent { background: var(--text); }
      .rvb-clock.urgent .time { color: #0f0f10; }
      .rvb-clock.urgent .context { color: #3a3a3d; }

      /* scoring server not answering: grey out the numbers instead of showing stale ones as live */
      #rvb-root.stale .rvb-score,
      #rvb-root.stale .rvb-clock .time { color: #5c5c61; }
    </style>
  </head>
  <body>
    <div id="sumo-root">
      <div class="match-badge">Match <span id="match-num">1</span></div>
      <div class="timer hidden" id="timer">2:00</div>

      <div class="team-wrapper team1-wrapper">
        <div class="team-box">
          <div class="team-label">Team</div>
          <div class="team-number" id="team1-num">1</div>
          <div class="team-name" id="team1-name">Blue</div>
        </div>
        <div class="ondeck-label" id="ondeck1-label">On Deck: <strong id="ondeck1-num"></strong></div>
      </div>

      <div class="arrows" id="arrows">
        <span class="arrow" id="arrow1">&#9650;</span>
        <span class="arrow" id="arrow2">&#9660;</span>
      </div>

      <div class="winner-banner" id="winner-banner">
        <div class="winner-label">Winner</div>
        <div class="winner-name" id="winner-name"></div>
      </div>

      <div class="team-wrapper team2-wrapper">
        <div class="team-box">
          <div class="team-label">Team</div>
          <div class="team-number" id="team2-num">2</div>
          <div class="team-name" id="team2-name">Red</div>
        </div>
        <div class="ondeck-label" id="ondeck2-label">On Deck: <strong id="ondeck2-num"></strong></div>
      </div>
    </div>

    <div id="rvb-root">
      <div class="rvb-clock" id="rvb-clock">
        <div class="context" id="rvb-context">Match 1</div>
        <div class="time" id="rvb-time">Ready</div>
      </div>

      <div class="rvb-bar">
        <div class="rvb-alliance blue">
          <div class="rvb-meta">
            <div class="rvb-team"><span class="num" id="rvb-blue1">1</span><span class="name" id="rvb-blue1-name"></span></div>
            <div class="rvb-team"><span class="num" id="rvb-blue2">2</span><span class="name" id="rvb-blue2-name"></span></div>
            <div class="rvb-detail" id="rvb-blue-detail">Auto 0 · 0 penalties</div>
          </div>
          <div class="rvb-score" id="rvb-blue-score">0</div>
        </div>
        <div class="rvb-alliance red">
          <div class="rvb-meta">
            <div class="rvb-team"><span class="num" id="rvb-red1">3</span><span class="name" id="rvb-red1-name"></span></div>
            <div class="rvb-team"><span class="num" id="rvb-red2">4</span><span class="name" id="rvb-red2-name"></span></div>
            <div class="rvb-detail" id="rvb-red-detail">Auto 0 · 0 penalties</div>
          </div>
          <div class="rvb-score" id="rvb-red-score">0</div>
        </div>
      </div>
    </div>

    <script>
      let timerEnd = null;
      let tickInterval = null;
      let gameMode = "sumo";

      async function poll() {
        try {
          const res = await fetch("/api/state");
          if (!res.ok) return;
          const data = await res.json();
          gameMode = data.gameMode || "sumo";
          setMode(gameMode);
          if (gameMode === "sumo") {
            applySumoState(data);
          } else {
            applyRvbTeams(data);
            await pollRvbScores();
          }
        } catch {
          // keep retrying
        }
      }

      function setMode(mode) {
        document.getElementById("sumo-root").classList.toggle("hidden", mode !== "sumo");
        document.getElementById("rvb-root").classList.toggle("visible", mode === "rvb");
      }

      function applySumoState(data) {
        document.getElementById("match-num").textContent = data.match;
        document.getElementById("team1-num").textContent = data.team1;
        document.getElementById("team2-num").textContent = data.team2;
        document.getElementById("team1-name").textContent = data.team1Name ?? "Blue";
        document.getElementById("team2-name").textContent = data.team2Name ?? "Red";

        const arrowsEl = document.getElementById("arrows");
        if (data.arrows) {
          arrowsEl.classList.add("visible");
          document.getElementById("arrow1").innerHTML = data.arrows === "up-down" ? "&#9650;" : "&#9660;";
          document.getElementById("arrow2").innerHTML = data.arrows === "up-down" ? "&#9660;" : "&#9650;";
        } else {
          arrowsEl.classList.remove("visible");
        }

        const od1 = document.getElementById("ondeck1-label");
        const od2 = document.getElementById("ondeck2-label");
        if (data.ondeck1 != null) {
          document.getElementById("ondeck1-num").textContent = "#" + data.ondeck1;
          od1.classList.add("visible");
        } else {
          od1.classList.remove("visible");
        }
        if (data.ondeck2 != null) {
          document.getElementById("ondeck2-num").textContent = "#" + data.ondeck2;
          od2.classList.add("visible");
        } else {
          od2.classList.remove("visible");
        }

        const bannerEl = document.getElementById("winner-banner");
        const hasWinner = !!data.winner;
        document.querySelector(".match-badge").style.display = hasWinner ? "none" : "";
        document.getElementById("timer").style.display = hasWinner ? "none" : "";
        document.querySelector(".team1-wrapper").style.visibility = hasWinner ? "hidden" : "";
        document.querySelector(".team2-wrapper").style.visibility = hasWinner ? "hidden" : "";
        document.getElementById("arrows").style.display = hasWinner ? "none" : "";
        if (hasWinner) {
          const isTeam1 = data.winner === "team1";
          bannerEl.className = "winner-banner visible " + data.winner;
          document.getElementById("winner-name").textContent = isTeam1 ? (data.team1Name ?? "Blue") : (data.team2Name ?? "Red");
        } else {
          bannerEl.className = "winner-banner";
        }

        if (data.timerEnd !== timerEnd) {
          timerEnd = data.timerEnd;
          if (timerEnd) {
            document.getElementById("timer").classList.remove("hidden");
            if (!tickInterval) tickInterval = setInterval(tick, 250);
            tick();
          } else {
            clearInterval(tickInterval);
            tickInterval = null;
            document.getElementById("timer").classList.add("hidden");
          }
        }
      }

      // The scoring server's phase strings are cues for drivers; the stream shows quieter labels.
      const RVB_PHASES = {
        "Controllers Down": "ready",
        "Auto": "Auto",
        "Pick Up Your Controller!": "Teleop next",
        "Drive Your Robot!": "Teleop",
        "Controllers Down (Match Ended)!": "final",
      };
      const RVB_SLOTS = ["Blue1", "Blue2", "Red1", "Red2"];
      const rvbLastScore = { blue: null, red: null };
      let rvbMatch = 1;

      function applyRvbTeams(data) {
        rvbMatch = data.match ?? rvbMatch;
        for (const slot of RVB_SLOTS) {
          const id = `rvb-${slot.toLowerCase()}`;
          document.getElementById(id).textContent = data[`rvb${slot}`] ?? "";
          document.getElementById(`${id}-name`).textContent = data[`rvb${slot}Name`] ?? "";
        }
      }

      function restartAnimation(el, cls) {
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
      }

      function setRvbScore(side, value) {
        const el = document.getElementById(`rvb-${side}-score`);
        if (rvbLastScore[side] !== null && value > rvbLastScore[side]) {
          restartAnimation(el.closest(".rvb-alliance"), "scored");
          restartAnimation(el, "bump");
        }
        rvbLastScore[side] = value;
        el.textContent = String(value);
      }

      const penalties = (n) => `${n} ${n === 1 ? "penalty" : "penalties"}`;
      const clockText = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

      async function pollRvbScores() {
        const root = document.getElementById("rvb-root");
        try {
          const res = await fetch("/api/rvb-scores");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          root.classList.remove("stale");

          setRvbScore("blue", data.blueScore ?? 0);
          setRvbScore("red", data.redScore ?? 0);
          document.getElementById("rvb-blue-detail").textContent = `Auto ${data.blueAutoScore ?? 0} · ${penalties(data.bluePens ?? 0)}`;
          document.getElementById("rvb-red-detail").textContent = `Auto ${data.redAutoScore ?? 0} · ${penalties(data.redPens ?? 0)}`;

          const raw = data.displayedPhase || "Controllers Down";
          const phase = RVB_PHASES[raw] ?? raw.replace(/!+$/, "");
          const secs = data.timeRemaining ?? 0;
          const clock = document.getElementById("rvb-clock");
          if (phase === "ready" || phase === "final") {
            document.getElementById("rvb-context").textContent = `Match ${rvbMatch}`;
            document.getElementById("rvb-time").textContent = phase === "ready" ? "Ready" : "Final";
            clock.classList.remove("urgent");
          } else {
            document.getElementById("rvb-context").textContent = `Match ${rvbMatch} · ${phase}`;
            document.getElementById("rvb-time").textContent = clockText(secs);
            clock.classList.toggle("urgent", phase === "Teleop" && secs <= 10);
          }
        } catch {
          root.classList.add("stale");
          document.getElementById("rvb-context").textContent = `Match ${rvbMatch} · Scores offline`;
          document.getElementById("rvb-clock").classList.remove("urgent");
        }
      }

      function tick() {
        if (!timerEnd) return;
        const remaining = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        const el = document.getElementById("timer");
        el.textContent = `${m}:${String(s).padStart(2, "0")}`;
        el.classList.toggle("urgent", remaining <= 30);
      }

      poll();
      setInterval(poll, 250);
    </script>
  </body>
</html>
